# Lychee link checker configuration

max_retries = 3
retry_wait_time = 5
max_concurrency = 10

# Treat 429 as valid after retries to avoid transient rate-limit failures.
accept = [200, 204, 206, 429]

# npm's HTML frontend blocks hosted CI; validate canonical package pages through its public registry.
remap = [
  '^https://(?:www\.)?npmjs\.com/package/((?:@[^/]+/)?[^/?#]+)$ https://registry.npmjs.org/$1',
]

# Exclude placeholder URLs used in documentation examples.
# Keep exceptions for known unavailable or intermittently unreachable links.
exclude = [
  "^https://\\.\\.\\./?$",
  "^https://github\\.com/wssheldon/osintui/?$",
  "^https://beelzebub-honeypot\\.com/?$",
  "^https://fnc\\.bsdbox\\.org/index/?$",
  "^https://www\\.gnu\\.org/software/hello/?$",
  "^https://www\\.atoptool\\.nl/downloadatop\\.php/?$",
  "^https://git\\.kittencollective\\.com/nebkor/joecalsend/?$",
  "^https://aspizu\\.github\\.io/goboscript/?$",
  "^https://github\\.com/aspizu/goboscript/?$",
  "^https://reim-developer\\.github\\.io/Sephera/?$",
  "^https://taskbook\\.sh/?$",
  "^https://chiselapp\\.com/user/MistressRemilia/repository/benben/?$",
  "^https://yeetfile\\.com/?$",
  # Known unavailable or persistently unreachable links in generated inventories.
  "^https://codeberg\\.org/ncts/drft/?$",
  "^https://github\\.com/Zuhaitz-dev/fat/?$",
  "^https://github\\.com/ccheshirecat/flint/?$",
  "^https://codemachine\\.co/?$",
  "^https://ampcode\\.com/?$",
  "^https://www\\.heyagent\\.dev/?$",
  "^https://gowebly\\.org/?$",
  "^https://pixelle\\.ai/?$",
  "^https://stakesquid\\.com/?$",
  "^https://docs\\.trieve\\.ai/getting-started/introduction/?$",
  "^https://better-env\\.dev/docs/?$",
  "^https://www\\.arjsoftware\\.com/files\\.htm$",
  "^https://anchor\\.dev/?$",
]

cache = true
user_agent = "homebrew-tap link checker (https://github.com/chenrui333/homebrew-tap)"
