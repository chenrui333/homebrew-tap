name: Bump formulae on schedule or request

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump-formula.yml
  workflow_dispatch:
    inputs:
      formulae:
        description: Custom list of formulae to livecheck and bump if outdated
        required: false
  schedule:
    - cron: "15 */2 * * *"

permissions:
  contents: read

jobs:
  autobump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: false
          cask: false

      - name: Trust tap
        run: brew trust --tap chenrui333/tap

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          username: BrewTestBot

      - name: Refresh tap checkout
        run: |
          tap_path="$(brew --repository chenrui333/tap)"
          git -C "$tap_path" fetch --no-tags origin main
          git -C "$tap_path" switch --force --detach origin/main
          git -C "$tap_path" reset --hard origin/main
          if [[ -n "$(git -C "$tap_path" status --porcelain)" ]]; then
            echo "::error::Tap checkout is not clean after refreshing to origin/main."
            exit 1
          fi

      # - name: Set up commit signing
      #   uses: Homebrew/actions/setup-commit-signing@b2da65092292aade9599608fc29415389641b3cb
      #   with:
      #     signing_key: ${{ secrets.BREWTESTBOT_GPG_SIGNING_SUBKEY }}

      - name: Get list of autobump formulae
        id: autobump
        run: |
          autobump_list=$(brew tap-info chenrui333/homebrew-tap --json | \
            jq -c -r '.[0]["formula_names"] | join(" ")')
          echo "autobump_list=$autobump_list" >> "$GITHUB_OUTPUT"

      - name: Bump formulae
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
          INPUT_FORMULAE: ${{ github.event.inputs.formulae || steps.autobump.outputs.autobump_list }}
        run: |
          set -euo pipefail

          tap_path="$(brew --repository chenrui333/tap)"
          formulae=()
          read -r -a formulae <<< "${INPUT_FORMULAE//$'\n'/ }"
          if ((${#formulae[@]} == 0)); then
            echo "::error::No formulae were selected for autobump."
            exit 1
          fi

          failed_formulae=()
          for formula in "${formulae[@]}"; do
            if [[ "$formula" == */*/* ]]; then
              qualified_formula="$formula"
            else
              qualified_formula="chenrui333/tap/$formula"
            fi

            echo "::group::Bump $qualified_formula"
            # Scheduled runs can wait in the GitHub queue. Refresh before each
            # candidate so stale formula files cannot conflict with origin/main.
            git -C "$tap_path" fetch --no-tags origin main
            git -C "$tap_path" switch --force --detach origin/main
            git -C "$tap_path" reset --hard origin/main

            if ! brew bump --full-name --no-fork --open-pr --formula "$qualified_formula"; then
              failed_formulae+=("$qualified_formula")
              echo "::warning::brew bump failed for $qualified_formula; continuing with the remaining formulae."
            else
              formula_name="${formula##*/}"
              # shellcheck disable=SC2016
              if ! pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
                --json number,title,headRefName | jq -r --arg formula "$formula_name" \
                '[.[] | select(.headRefName | startswith("bump-")) |
                  select(.title | startswith($formula + " "))] | first | .number // empty')"; then
                echo "::warning::Could not find the open PR for $qualified_formula to set CI-no-fail-fast."
                pr_number=""
              fi
              if [[ -n "$pr_number" ]]; then
                if ! gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-label CI-no-fail-fast; then
                  echo "::warning::Could not set CI-no-fail-fast on PR #$pr_number; formula CI will still use no-fail-fast for autobumps."
                fi
              fi
            fi

            # A failed bump can leave its formula modified or its branch checked
            # out. The Actions checkout is disposable; restore it before proceeding.
            git -C "$tap_path" switch --force --detach origin/main
            git -C "$tap_path" reset --hard origin/main
            if [[ -n "$(git -C "$tap_path" status --porcelain)" ]]; then
              echo "::error::Tap checkout is not clean after bumping $qualified_formula."
              exit 1
            fi
            echo "::endgroup::"
          done

          if ((${#failed_formulae[@]} > 0)); then
            printf 'Failed formula bump attempts: %s\n' "${failed_formulae[*]}"
            exit 1
          fi
