name: Rebottle

run-name: Request a rebuild PR for ${{ inputs.formula }}

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "One tap formula to rebuild through a normal revision PR"
        required: true
        type: string

concurrency:
  group: rebottle-${{ inputs.formula }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1

jobs:
  request-rebuild:
    # Never evaluate another ref's recipes with the publication credential.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Check out the immutable dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select one formula without interrupting an existing PR
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { planRebottle } = require('./.github/scripts/rebottle-pr')
            const plan = await planRebottle({ github, context })
            if (plan.kind === 'existing') core.notice(`Existing formula work retained: ${plan.url}`)
            return plan

      - name: Increment only the requested recipe revision
        if: fromJson(steps.plan.outputs.result).kind == 'new'
        env:
          REBUILD_PLAN: ${{ steps.plan.outputs.result }}
        run: |
          formula_path=$(jq -er '.path' <<< "$REBUILD_PLAN")
          formula=$(jq -er '.qualifiedFormula' <<< "$REBUILD_PLAN")
          original_sha=$(jq -er '.sourceSha' <<< "$REBUILD_PLAN")
          test "$(git hash-object "$formula_path")" = "$original_sha"
          # Narrow the old tap-wide trust to the reviewed main recipe only.
          brew trust --formula "$formula"
          brew bump-revision --write-only "$formula"
          test "$(git diff --name-only)" = "$formula_path"

      - name: Publish the revision PR, not bottles
        if: fromJson(steps.plan.outputs.result).kind == 'new'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REBUILD_PLAN: ${{ steps.plan.outputs.result }}
        with:
          # A maintainer credential permits the PR's normal CI events. The
          # automatic GITHUB_TOKEN would suppress those follow-on workflows.
          github-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          script: |
            const { readFile } = require('node:fs/promises')
            const { publishRebottle } = require('./.github/scripts/rebottle-pr')
            const plan = JSON.parse(process.env.REBUILD_PLAN)
            const content = await readFile(plan.path, 'utf8')
            const result = await publishRebottle({ github, context, plan, content })
            await core.summary.addHeading('Rebuild request')
              .addLink(`PR #${result.number}`, result.url)
              .addRaw('\nSource testing, bottle publication and merge use the ordinary PR workflows.\n')
              .write()
