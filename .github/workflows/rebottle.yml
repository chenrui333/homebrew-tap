name: Rebottle

run-name: Rebuild bottles of ${{ inputs.formula }}

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name to build new bottles for"
        required: true

concurrency: rebottle-${{ github.event.inputs.formula }}

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  HOMEBREW_RELOCATABLE_INSTALL_NAMES: 1

jobs:
  bottle:
    permissions:
      contents: read

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    defaults:
      run:
        shell: /bin/bash -e {0}
        working-directory: ${{ matrix.workdir || github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-26
          - runner: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --user=linuxbrew --env=HOMEBREW_SANDBOX_LINUX_LANDLOCK=1
            workdir: /github/home
          - runner: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --user=linuxbrew --env=HOMEBREW_SANDBOX_LINUX_LANDLOCK=1
            workdir: /github/home
    env:
      BOTTLES_DIR: ${{ matrix.workdir || github.workspace }}/bottles
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Pre-test steps
        uses: Homebrew/actions/pre-build@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          bottles-directory: ${{ env.BOTTLES_DIR }}

      - name: Build bottles via test-bot
        working-directory: ${{ env.BOTTLES_DIR }}
        run: brew test-bot --only-formulae --skip-dependents --only-json-tab --skip-online-checks "$FORMULA_NAME"
        env:
          FORMULA_NAME: ${{ github.event.inputs.formula }}
          HOMEBREW_GITHUB_API_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Post-build steps
        if: always()
        uses: Homebrew/actions/post-build@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          runner: ${{ matrix.runner }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ env.BOTTLES_DIR }}/logs

  upload:
    permissions:
      # issues: write # for Homebrew/actions/post-comment # we dont do issue comment in here
      contents: write # for Homebrew/actions/git-try-push
      packages: write # for brew pr-upload
      pull-requests: write

    runs-on: ubuntu-latest
    needs: bottle
    env:
      GH_REPO: ${{github.repository}}
      GH_NO_UPDATE_NOTIFIER: 1
      GH_PROMPT_DISABLED: 1
      BOTTLE_BRANCH: ${{github.actor}}/dispatch/${{inputs.formula}}/${{github.run_id}}
      BOTTLES_DIR: ${{ github.workspace }}/bottles
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fc695c54c2032716dd4cedd007489c8e32fc8a5d

      - name: Download bottles from GitHub Actions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottles_*
          path: ${{ env.BOTTLES_DIR }}
          merge-multiple: true

      - name: Setup git
        id: git-user-config
        uses: Homebrew/actions/git-user-config@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          username: BrewTestBot

      - name: Checkout branch for bottle commit
        working-directory: ${{steps.set-up-homebrew.outputs.repository-path}}
        run: git checkout -b "$BOTTLE_BRANCH" origin/main # the tap is using main branch

      - name: Upload bottles to GitHub Packages
        id: upload
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: chenrui333
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{secrets.HOMEBREW_GITHUB_API_TOKEN}}
          BREWTESTBOT_NAME_EMAIL: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" # see https://github.com/actions/checkout?tab=readme-ov-file#push-a-commit-using-the-built-in-token
          HOMEBREW_CORE_PATH: ${{steps.set-up-homebrew.outputs.repository-path}}
        working-directory: ${{ env.BOTTLES_DIR }}
        run: |
          brew pr-upload --verbose --committer="$BREWTESTBOT_NAME_EMAIL" --root-url="https://ghcr.io/v2/chenrui333/tap" --debug
          echo "title=$(git -C "$HOMEBREW_CORE_PATH" log -1 --format='%s' "$BOTTLE_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git -C "$HOMEBREW_CORE_PATH" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push bottle commit
        uses: Homebrew/actions/git-try-push@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          token: ${{ github.token }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ env.BOTTLE_BRANCH }}

      - name: Open bottle pull request
        uses: Homebrew/actions/create-pull-request@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          head: ${{ env.BOTTLE_BRANCH }}
          base: main
          title: ${{ steps.upload.outputs.title }}
          body: |
            Created by the rebottle workflow for `${{ inputs.formula }}`.
