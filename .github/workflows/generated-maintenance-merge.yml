name: Merge generated maintenance PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - edited

permissions: {}

concurrency:
  group: generated-maintenance-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      contains(fromJSON('["automation/update-formulae-list", "automation/terminal-trove-weekly", "automation/formula-merge-serialize-20260926"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-slim
    timeout-minutes: 240
    permissions:
      checks: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      GH_PROMPT_DISABLED: 1
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Validate generated PR and merge after checks
        shell: bash
        run: |
          set -euo pipefail

          case "$HEAD_REF" in
            automation/update-formulae-list)
              expected_files='README.md'
              ;;
            automation/terminal-trove-weekly)
              expected_files=$'docs/terminal-trove/.project_links_cache.json\ndocs/terminal-trove/terminal_trove_weekly.md'
              ;;
            automation/formula-merge-serialize-20260926)
              expected_files=$'.github/workflows/formula-merge.yml\n.github/workflows/generated-maintenance-merge.yml'
              ;;
            *)
              echo "Branch is not an allowlisted generated-maintenance PR; skipping."
              exit 0
              ;;
          esac

          expected_head="$EVENT_HEAD_SHA"
          deadline=$((SECONDS + 4 * 60 * 60))
          checks_ready=false

          while (( SECONDS < deadline )); do
            pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            state="$(jq -r '.state' <<< "$pr_data")"
            draft="$(jq -r '.draft' <<< "$pr_data")"
            base_branch="$(jq -r '.base.ref' <<< "$pr_data")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
            current_head="$(jq -r '.head.sha' <<< "$pr_data")"
            current_branch="$(jq -r '.head.ref' <<< "$pr_data")"
            labels="$(jq -r '[.labels[].name] | join("\n")' <<< "$pr_data")"

            if [[ "$state" != open || "$draft" != false || "$base_branch" != main ||
                  "$head_repo" != "$GITHUB_REPOSITORY" || "$current_branch" != "$HEAD_REF" ||
                  "$current_head" != "$expected_head" ]] ||
               grep -Fxq 'in progress' <<< "$labels"; then
              echo "PR changed or is held; leaving it unmerged."
              exit 0
            fi

            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | jq -r '.[].filename' | sort)"
            if [[ "$files" != "$expected_files" ]]; then
              echo "Generated PR file set changed; leaving it unmerged."
              exit 0
            fi

            checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null || true)"
            summary="$(jq -c '
              . as $all |
              [$all[] | select(.workflow != "Merge generated maintenance PRs")] as $checks |
              {
                pending: [$checks[] | select(.bucket == "pending") | .name],
                failed: [$checks[] | select(.bucket == "fail" or .bucket == "cancel") | .name],
                unsupported: [$checks[] | select(.bucket != "pass" and .bucket != "skipping" and
                  .bucket != "pending" and .bucket != "fail" and .bucket != "cancel") | .name],
                missing: (["merge-ready", "Spell Check", "GitGuardian Security Checks"] as $expected |
                  [$expected[] as $name | select([$checks[] | select(.name == $name and .bucket == "pass")] | length == 0) | $name])
              }
            ' <<< "$checks")"

            if [[ "$(jq '(.failed | length) + (.unsupported | length)' <<< "$summary")" -gt 0 ]]; then
              jq -r '"Checks failed or have unsupported results: " + ((.failed + .unsupported) | join(", "))' <<< "$summary"
              exit 1
            fi

            if [[ "$(jq '(.pending | length) + (.missing | length)' <<< "$summary")" -eq 0 ]]; then
              echo "All checks passed on $expected_head."
              checks_ready=true
              break
            fi

            jq -r '"Waiting for checks: " + ((.pending + .missing) | join(", "))' <<< "$summary"
            sleep 15
          done

          if [[ "$checks_ready" != true ]]; then
            echo "Timed out waiting for checks on the generated PR."
            exit 1
          fi

          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(jq -r '.head.sha' <<< "$pr_data")"
          labels="$(jq -r '[.labels[].name] | join("\n")' <<< "$pr_data")"
          if [[ "$(jq -r '.state' <<< "$pr_data")" != open ||
                "$(jq -r '.draft' <<< "$pr_data")" != false ||
                "$(jq -r '.base.ref' <<< "$pr_data")" != main ||
                "$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")" != "$GITHUB_REPOSITORY" ||
                "$(jq -r '.head.ref' <<< "$pr_data")" != "$HEAD_REF" ||
                "$current_head" != "$expected_head" ]] ||
             grep -Fxq 'in progress' <<< "$labels"; then
            echo "PR changed after CI; refusing to merge."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$expected_head"
