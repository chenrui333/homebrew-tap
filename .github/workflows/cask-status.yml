name: Cask Metadata

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

concurrency:
  group: cask-status
  cancel-in-progress: true

jobs:
  generate-metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Trust tap
        run: brew trust --tap chenrui333/tap

      # Homebrew setup replaces the workspace Git directory.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          fetch-depth: 0

      - name: Prepare automation branch
        id: prepare
        env:
          BRANCH: automation/cask-metadata
        run: .github/scripts/publish-generated-pr.sh prepare

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Test cask report fixtures
        run: python3 -B -m unittest discover -s cask-status

      - name: Generate cask metadata
        run: python3 cask-status/generate_cask_status.py --output cask-status/cask-status.md

      - name: Publish generated PR
        env:
          BRANCH: automation/cask-metadata
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          PR_TITLE: 'chore: update cask metadata'
          PR_BODY: Generated automatically by the Cask Metadata workflow.
          COMMIT_MESSAGE: 'chore: update cask metadata'
        run: .github/scripts/publish-generated-pr.sh publish cask-status/cask-status.md
