name: Terminal Trove Weekly Scraper

on:
  schedule:
    # Run every Thursday at 9 AM UTC
    - cron: '0 9 * * 4'
  workflow_dispatch:

concurrency:
  group: terminal-trove-weekly
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Prepare automation branch
        id: prepare
        env:
          BRANCH: automation/terminal-trove-weekly
        run: .github/scripts/publish-generated-pr.sh prepare

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Run Terminal Trove scraper
        working-directory: ./docs/terminal-trove
        run: python3 scrape_terminal_trove.py

      - name: Publish generated PR
        id: publish
        env:
          BRANCH: automation/terminal-trove-weekly
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          PR_TITLE: 'chore: update terminal trove weekly tools list'
          PR_BODY: Generated automatically by the Terminal Trove Weekly Scraper workflow.
          COMMIT_MESSAGE: 'chore: update terminal trove weekly tools list'
        run: .github/scripts/publish-generated-pr.sh publish docs/terminal-trove/terminal_trove_weekly.md docs/terminal-trove/.project_links_cache.json
