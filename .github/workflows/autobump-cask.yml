name: Bump casks on schedule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump-cask.yml
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    - cron: "45 */2 * * *"

permissions:
  contents: read

jobs:
  autobump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: false
          cask: false

      - name: Trust tap
        run: brew trust --tap chenrui333/tap

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          username: BrewTestBot

      - name: Get list of autobump casks
        id: autobump
        run: |
          autobump_list=$(brew tap-info chenrui333/homebrew-tap --json | \
            jq -c -r '.[0]["cask_tokens"] | join(" ")')
          echo "autobump_list=$autobump_list" >> "$GITHUB_OUTPUT"

      - name: Bump casks
        continue-on-error: true
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
          INPUT_CASKS: ${{ github.event.inputs.casks || steps.autobump.outputs.autobump_list }}
        run: |
          casks=()
          for cask in $INPUT_CASKS; do
            if [[ "$cask" == */*/* ]]; then
              casks+=("$cask")
            else
              casks+=("chenrui333/tap/$cask")
            fi
          done

          brew bump --full-name --no-fork --open-pr --casks "${casks[@]}"
