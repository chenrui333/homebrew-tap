name: Update Formula and Cask Lists

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "Casks/**"
      - ".github/scripts/update-list.sh"
      - ".github/workflows/update-formula-cask-list.yml"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

# Keep only the newest run for a given ref.
# Side effect: older commits can show a cancelled check in GitHub's UI because
# concurrency cancellation is reported as cancelled, not skipped/successful.
concurrency:
  group: update-formulae-list
  cancel-in-progress: true

jobs:
  update-list:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Prepare automation branch
        id: prepare
        env:
          BRANCH: automation/update-formulae-list
        run: .github/scripts/publish-generated-pr.sh prepare
      - name: Run update-list script
        run: .github/scripts/update-list.sh

      - name: Publish generated PR
        id: publish
        env:
          BRANCH: automation/update-formulae-list
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          PR_TITLE: 'chore: update formula and cask lists'
          PR_BODY: Generated automatically by the Update Formula and Cask Lists workflow.
          COMMIT_MESSAGE: Update formula and cask lists
        run: .github/scripts/publish-generated-pr.sh publish README.md
