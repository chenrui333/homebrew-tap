name: Update Formulae List

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

# Keep only the newest run for a given ref.
# Side effect: older commits can show a cancelled check in GitHub's UI because
# concurrency cancellation is reported as cancelled, not skipped/successful.
concurrency:
  group: update-formulae-list
  cancel-in-progress: true

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  update-list:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare automation branch
        id: prepare
        env:
          BRANCH: automation/update-formulae-list
        run: .github/scripts/publish-generated-pr.sh prepare

      - run: brew update

      - name: Tap the repo
        run: brew tap chenrui333/tap

      - name: Run update-list script
        run:  .github/scripts/update-list.sh

      - name: Publish generated PR
        id: publish
        env:
          BRANCH: automation/update-formulae-list
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: 'chore: update formulae list'
          PR_BODY: Generated automatically by the Update Formulae List workflow.
          COMMIT_MESSAGE: Update formulae list
        run: .github/scripts/publish-generated-pr.sh publish README.md
