name: Strict network sandbox audits

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of formula and exact source SHA pairs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: network-sandbox-strict-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/homebrew/ubuntu24.04:main@sha256:af86fd4ac6eacb255eae173eee12cd1d8e139ab4b7e9aeadeb974ebdc840dc02
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact audit targets
        env:
          AUDIT_TARGETS: ${{ inputs.targets }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          targets = json.loads(os.environ["AUDIT_TARGETS"])
          if not isinstance(targets, list) or not 1 <= len(targets) <= 32:
              raise ValueError("Provide between one and 32 formula/SHA pairs")
          rows = []
          for target in targets:
              if not isinstance(target, dict) or set(target) != {"formula", "sha"}:
                  raise ValueError("Each target must contain only formula and sha")
              formula, sha = target["formula"], target["sha"]
              if not isinstance(formula, str) or not re.fullmatch(r"[a-z0-9][a-z0-9+@._-]*", formula):
                  raise ValueError("Invalid formula name")
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("Expected an exact 40-character commit SHA")
              rows.append(f"{formula}\t{sha}\n")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "network-sandbox-audit-targets.tsv").write_text("".join(rows))
          PY

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: true
          cask: false

      - name: Audit exact formula sources strictly
        shell: bash
        run: |
          set -euo pipefail
          tap_path="$(brew --repository chenrui333/tap)"
          while IFS=$'\t' read -r formula expected_sha; do
            git -C "$tap_path" fetch origin "$expected_sha"
            git -C "$tap_path" checkout --detach "$expected_sha"
            actual_sha="$(git -C "$tap_path" rev-parse HEAD)"
            test "$actual_sha" = "$expected_sha"
            echo "Strict audit: $formula at $actual_sha"
            brew audit --strict --online --formula "chenrui333/tap/$formula"
            HOMEBREW_SIMULATE_MACOS_ON_LINUX=1 brew audit --strict --online --formula "chenrui333/tap/$formula"
            printf '%s\t%s\tpassed\n' "$formula" "$actual_sha" >> "$RUNNER_TEMP/strict-audit-results.tsv"
          done < "$RUNNER_TEMP/network-sandbox-audit-targets.tsv"

      - name: Summarize verified heads
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/strict-audit-results.tsv" ]]; then
            cat "$RUNNER_TEMP/strict-audit-results.tsv" >> "$GITHUB_STEP_SUMMARY"
          fi
