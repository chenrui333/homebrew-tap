name: Strict network sandbox audits

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of formula and exact source SHA pairs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: network-sandbox-strict-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/homebrew/ubuntu24.04:main@sha256:af86fd4ac6eacb255eae173eee12cd1d8e139ab4b7e9aeadeb974ebdc840dc02
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_GITHUB_ACTIONS: 1
      AUDIT_DIR: /tmp/network-sandbox-${{ github.run_id }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: true
          cask: false

      - name: Validate exact audit targets
        env:
          AUDIT_TARGETS: ${{ inputs.targets }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const targets = JSON.parse(process.env.AUDIT_TARGETS);
            if (!Array.isArray(targets) || targets.length < 1 || targets.length > 32) {
              throw new Error("Provide between one and 32 formula/SHA pairs");
            }
            const rows = targets.map(target => {
              if (!target || Array.isArray(target) || Object.keys(target).sort().join(",") !== "formula,sha") {
                throw new Error("Each target must contain only formula and sha");
              }
              const {formula, sha} = target;
              if (typeof formula !== "string" || !/^[a-z0-9][a-z0-9+@._-]*$/.test(formula)) {
                throw new Error("Invalid formula name");
              }
              if (typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) {
                throw new Error("Expected an exact 40-character commit SHA");
              }
              return `${formula}\t${sha}\n`;
            });
            fs.mkdirSync(process.env.AUDIT_DIR, {recursive: true});
            fs.writeFileSync(path.join(process.env.AUDIT_DIR, "targets.tsv"), rows.join(""));

      - name: Audit exact formula sources strictly
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
        shell: bash
        run: |
          set -euo pipefail
          tap_path="$(brew --repository chenrui333/tap)"
          failures=0
          while IFS=$'\t' read -r formula expected_sha; do
            git -C "$tap_path" fetch origin "$expected_sha"
            git -C "$tap_path" checkout --detach "$expected_sha"
            actual_sha="$(git -C "$tap_path" rev-parse HEAD)"
            test "$actual_sha" = "$expected_sha"
            echo "Strict audit: $formula at $actual_sha"
            for definition in linux macos; do
              if [[ "$definition" == macos ]]; then
                export HOMEBREW_SIMULATE_MACOS_ON_LINUX=1
              else
                unset HOMEBREW_SIMULATE_MACOS_ON_LINUX
              fi
              if brew audit --strict --online --formula "chenrui333/tap/$formula"; then
                result=passed
              else
                result=failed
                failures=$((failures + 1))
              fi
              printf '%s\t%s\t%s\t%s\n' "$formula" "$actual_sha" "$definition" "$result" >> "$AUDIT_DIR/results.tsv"
            done
          done < "$AUDIT_DIR/targets.tsv"
          test "$failures" -eq 0

      - name: Summarize verified heads
        if: always()
        shell: bash
        run: |
          if [[ -f "$AUDIT_DIR/results.tsv" ]]; then
            cat "$AUDIT_DIR/results.tsv"
            cat "$AUDIT_DIR/results.tsv" >> "$GITHUB_STEP_SUMMARY"
          fi
