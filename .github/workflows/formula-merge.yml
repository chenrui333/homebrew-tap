name: brew formula-merge

on:
  pull_request_target:
    types:
      - labeled
      - synchronize
      - unlabeled
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  workflow_run:
    workflows:
      - Build and Test Formulae
      - Merge Gate
      - Triage tasks
    types:
      - completed

permissions:
  checks: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: formula-merge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.run_id }}-${{ github.event.workflow_run.name || github.event.action || github.event_name }}
  cancel-in-progress: true

jobs:
  cancel-stale-auto-merge:
    if: >-
      github.event_name == 'pull_request_target' &&
      (contains(fromJSON('["synchronize", "unlabeled", "converted_to_draft", "edited"]'), github.event.action) ||
      (github.event.action == 'labeled' && github.event.label.name == 'in progress'))
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Disable stale auto-merge
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          auto_merge_enabled="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge_enabled" == "true" ]]; then
            gh pr merge "$PR_NUMBER" --disable-auto --repo "$GITHUB_REPOSITORY"
          else
            echo "No auto-merge is enabled for PR #$PR_NUMBER."
          fi

  merge:
    needs: cancel-stale-auto-merge
    if: >-
      (needs.cancel-stale-auto-merge.result == 'success' || needs.cancel-stale-auto-merge.result == 'skipped') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-slim
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      GH_PROMPT_DISABLED: 1
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Resolve and validate formula PR
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" && -n "$EVENT_HEAD_BRANCH" ]]; then
            head_owner="$GITHUB_REPOSITORY_OWNER"
            PR_NUMBER="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f "head=$head_owner:$EVENT_HEAD_BRANCH" \
              --jq "[.[] | select(.head.sha == \"$EVENT_HEAD_SHA\")] | first | .number // empty")"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR matches this workflow event; skipping."
            exit 0
          fi

          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr_data")"
          draft="$(jq -r '.draft' <<< "$pr_data")"
          base_branch="$(jq -r '.base.ref' <<< "$pr_data")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_data")"

          if [[ "$state" != open || "$draft" != false || "$base_branch" != main ||
                "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR is not an open, ready, same-repository formula PR targeting main; skipping."
            exit 0
          fi

          if [[ -n "$EVENT_HEAD_SHA" && "$EVENT_HEAD_SHA" != "$head_sha" ]]; then
            echo "Workflow event is for a stale PR head; skipping."
            exit 0
          fi

          labels="$(jq -r '[.labels[].name] | join("\n")' <<< "$pr_data")"
          for required_label in pr-pull CI-no-fail-fast CI-published-bottle-commits; do
            if ! grep -Fxq "$required_label" <<< "$labels"; then
              echo "PR is missing $required_label; skipping."
              exit 0
            fi
          done

          if grep -Fxq 'in progress' <<< "$labels"; then
            echo "PR is intentionally held with the in progress label; skipping."
            exit 0
          fi

          files="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | \
            jq -r '[.[][] | .filename] | unique | .[]')"
          file_count="$(awk 'NF { count++ } END { print count + 0 }' <<< "$files")"
          if [[ "$file_count" -ne 1 || ! "$files" =~ ^Formula/.+\.rb$ ]]; then
            echo "PR must change exactly one formula file; skipping."
            exit 0
          fi

          published_head=""
          attempt=0
          while (( attempt < 12 )); do
            attempt=$((attempt + 1))
            published_head="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
              jq -r '[.[][] | select(.user.login == "github-actions[bot]") | .body // "" |
                select(test("^<!-- homebrew-tap: published-bottle-head [0-9a-f]{40} -->$")) |
                capture("^<!-- homebrew-tap: published-bottle-head (?<sha>[0-9a-f]{40}) -->$").sha] | last // empty')"
            [[ "$published_head" == "$head_sha" ]] && break
            sleep 5
          done

          if [[ "$published_head" != "$head_sha" ]]; then
            echo "No published-bottle marker matches the current PR head; skipping."
            exit 0
          fi

          {
            echo "eligible=true"
            echo "head_sha=$head_sha"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for successful checks on the published head
        if: steps.validate.outputs.eligible == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 4 * 60 * 60))

          while (( SECONDS < deadline )); do
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            if [[ "$current_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "PR head changed while checks were running; leaving it for the new-head run."
              exit 0
            fi

            checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json name,state,bucket,workflow 2>/dev/null || true)"
            summary="$(jq -cer '
              map(select(.workflow != "brew formula-merge")) as $checks |
              {
                pending: [$checks[] | select(.bucket == "pending") | .name],
                failed: [$checks[] | select(.bucket == "fail" or .bucket == "cancel") | .name],
                unsupported: [$checks[] | select(.bucket != "pass" and .bucket != "skipping" and
                  .bucket != "pending" and .bucket != "fail" and .bucket != "cancel") | .name],
                missing: (["tap-syntax", "formula-conclusion", "merge-ready"] as $expected |
                  [$expected[] as $name | select([$checks[] | select(.name == $name and .bucket == "pass")] | length == 0) | $name])
              }
            ' <<< "$checks")"

            if [[ "$(jq '(.failed | length) + (.unsupported | length)' <<< "$summary")" -gt 0 ]]; then
              jq -r '"Checks failed or have an unsupported result: " + ((.failed + .unsupported) | join(", "))' <<< "$summary"
              exit 1
            fi

            if [[ "$(jq '(.pending | length) + (.missing | length)' <<< "$summary")" -eq 0 ]]; then
              echo "All checks passed on $EXPECTED_HEAD_SHA."
              exit 0
            fi

            jq -r '"Waiting for checks: " + ((.pending + .missing) | join(", "))' <<< "$summary"
            sleep 30
          done

          echo "Timed out waiting for checks on the published PR head."
          exit 1

      - name: Enable merge-commit auto-merge
        if: steps.validate.outputs.eligible == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(jq -r '.head.sha' <<< "$pr_data")"
          labels="$(jq -r '[.labels[].name] | join("\n")' <<< "$pr_data")"
          state="$(jq -r '.state' <<< "$pr_data")"
          draft="$(jq -r '.draft' <<< "$pr_data")"
          base_branch="$(jq -r '.base.ref' <<< "$pr_data")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
          files="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | \
            jq -r '[.[][] | .filename] | unique | .[]')"
          file_count="$(awk 'NF { count++ } END { print count + 0 }' <<< "$files")"
          published_head="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
            jq -r '[.[][] | select(.user.login == "github-actions[bot]") | .body // "" |
              select(test("^<!-- homebrew-tap: published-bottle-head [0-9a-f]{40} -->$")) |
              capture("^<!-- homebrew-tap: published-bottle-head (?<sha>[0-9a-f]{40}) -->$").sha] | last // empty')"
          if [[ "$state" != open || "$draft" != false || "$base_branch" != main ||
                "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$current_head" != "$EXPECTED_HEAD_SHA" ||
                "$published_head" != "$EXPECTED_HEAD_SHA" ||
                "$file_count" -ne 1 || ! "$files" =~ ^Formula/.+\.rb$ ]] ||
             grep -Fxq 'in progress' <<< "$labels" ||
             ! grep -Fxq 'CI-published-bottle-commits' <<< "$labels" ||
             ! grep -Fxq 'pr-pull' <<< "$labels" ||
             ! grep -Fxq 'CI-no-fail-fast' <<< "$labels"; then
            echo "PR changed or became ineligible after CI; refusing to enable auto-merge."
            exit 0
          fi

          checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,bucket,workflow 2>/dev/null || true)"
          summary="$(jq -cer '
            map(select(.workflow != "brew formula-merge")) as $checks |
            {
              pending: [$checks[] | select(.bucket == "pending") | .name],
              failed: [$checks[] | select(.bucket == "fail" or .bucket == "cancel") | .name],
              unsupported: [$checks[] | select(.bucket != "pass" and .bucket != "skipping" and
                .bucket != "pending" and .bucket != "fail" and .bucket != "cancel") | .name],
              missing: (["tap-syntax", "formula-conclusion", "merge-ready"] as $expected |
                [$expected[] as $name | select([$checks[] | select(.name == $name and .bucket == "pass")] | length == 0) | $name])
            }
          ' <<< "$checks")"
          if [[ "$(jq '(.failed | length) + (.unsupported | length) + (.pending | length) + (.missing | length)' <<< "$summary")" -gt 0 ]]; then
            jq -r '"Checks are no longer merge-ready: " + ((.failed + .unsupported + .pending + .missing) | join(", "))' <<< "$summary"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --match-head-commit "$EXPECTED_HEAD_SHA"
