name: brew cask-merge

on:
  pull_request_target:
    types:
      - labeled
      - synchronize
      - unlabeled
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - Build and Test Casks
      - Triage tasks
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open cask PR number to re-evaluate through the normal merge gate
        required: true
        type: number

permissions:
  contents: read

# Keep the current waiter alive when unrelated label events create skipped runs.
concurrency:
  group: cask-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  cask-merge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' &&
       (contains(fromJSON('["synchronize", "reopened", "ready_for_review"]'), github.event.action) ||
        (github.event.action == 'labeled' && github.event.label.name == 'pr-cask-merge') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'in progress')) &&
       contains(github.event.pull_request.labels.*.name, 'pr-cask-merge') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot' &&
       github.event.pull_request.state == 'open' &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # Never execute PR-head code with the publishing token.
      - name: Check out trusted merge controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for qualified cask head and merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          script: |
            const {mergeQualifiedCask} = require('./.github/scripts/qualified-cask-merge')
            await mergeQualifiedCask({github, context, core})
