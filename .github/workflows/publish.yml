name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open formula PR number to publish or reconcile
        required: true
        type: number

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'pr-pull') && 'brew-pr-pull' || format('brew-pr-pull-skip-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  pr-pull:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'pr-pull' &&
       github.event.pull_request.user.type != 'Bot' &&
       github.event.pull_request.state == 'open' &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      PR: ${{ inputs.pr_number || github.event.pull_request.number }}
      PUBLISHED_HEAD_CONTEXT: homebrew-tap/published-bottle-head
    permissions:
      actions: read
      contents: write
      pull-requests: write
      packages: write
      statuses: write
    steps:
      - name: Validate PR
        id: pr-details
        if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'pr-pull'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          state="$(jq -r '.state' <<< "$pr_data")"
          draft="$(jq -r '.draft' <<< "$pr_data")"
          base_branch="$(jq -r '.base.ref' <<< "$pr_data")"
          head_branch="$(jq -r '.head.ref // empty' <<< "$pr_data")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
          expected_head="$(jq -r '.head.sha' <<< "$pr_data")"
          title="$(jq -r '.title' <<< "$pr_data")"
          labels="$(jq -r '[.labels[].name] | join("\n")' <<< "$pr_data")"
          author_type="$(jq -r '.user.type // empty' <<< "$pr_data")"

          if [[ "$title" =~ [\$\`\;] ]]; then
            echo "PR title contains suspicious characters"
            exit 1
          fi

          if [[ "$draft" != "false" || "$base_branch" != "main" ||
                "$head_repo" != "$GITHUB_REPOSITORY" || "$head_branch" == "main" ||
                -z "$head_branch" || -z "$expected_head" || "$author_type" == "Bot" ]]; then
            echo "PR must be an open, non-draft, same-repository PR targeting main"
            echo "state=$state draft=$draft base=$base_branch head_repo=$head_repo branch=$head_branch"
            exit 1
          fi

          if [[ "$state" != "open" ]]; then
            merged="$(jq -r '.merged_at != null' <<< "$pr_data")"
            if [[ "$state" != "closed" || "$merged" != "true" ]]; then
              echo "PR must be open unless it has already merged."
              exit 1
            fi
            echo "PR merged while publication was queued; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq 'in progress' <<< "$labels"; then
            echo "PR is intentionally held; skipping publication and reconciliation."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "held=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq 'CI-no-bottles' <<< "$labels"; then
            echo "CI-no-bottles is set; skipping bottle publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "no_bottles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Fxq 'pr-pull' <<< "$labels"; then
            echo "Refusing publication because the PR does not have the pr-pull label."
            exit 1
          fi

          {
            echo "number=$PR"
            echo "expected_head=$expected_head"
            echo "head_branch=$head_branch"
            echo "head_repo=$head_repo"
            echo "base_branch=$base_branch"
          } >> "$GITHUB_OUTPUT"

          published_status="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$expected_head/statuses" | \
            jq -r --arg context "$PUBLISHED_HEAD_CONTEXT" '
              [.[][] | select(.context == $context and .creator.login == "github-actions[bot]")] |
              first | .state == "success"')"

          # Legacy PRs recorded the published head in a comment; reconcile migrates it to the commit status.
          legacy_marker_author=""
          if [[ "$published_status" != true ]]; then
            legacy_marker="$({
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments"
            } | jq -c --arg owner "$GITHUB_REPOSITORY_OWNER" '
              [.[][] | select(.user.login == "github-actions[bot]" or .user.login == $owner) |
                select((.body // "") | test("^<!-- homebrew-tap: published-bottle-head [0-9a-f]{40} -->$")) |
                {author: .user.login,
                 sha: (.body | capture("^<!-- homebrew-tap: published-bottle-head (?<sha>[0-9a-f]{40}) -->$").sha)}] |
                last // {}')"
            if [[ "$(jq -r '.sha // empty' <<< "$legacy_marker")" == "$expected_head" ]]; then
              legacy_marker_author="$(jq -r '.author' <<< "$legacy_marker")"
            fi
          fi

          # A previous attempt can push bottle commits and then fail before recording the status. Recover only an
          # exact chain of BrewTestBot bottle commits on top of a source head that passed tests on this PR branch.
          recovered_bottle_commit=false
          if [[ "$published_status" != true && -z "$legacy_marker_author" ]]; then
            candidate="$expected_head"
            bottle_commits=0
            reached_source_head=false
            while (( bottle_commits < 20 )); do
              commit_data="$(gh api "repos/$GITHUB_REPOSITORY/commits/$candidate")"
              if ! jq -e --arg email "1589480+BrewTestBot@users.noreply.github.com" '
                  .commit.author.name == "BrewTestBot" and .commit.author.email == $email and
                  .commit.committer.name == "BrewTestBot" and .commit.committer.email == $email and
                  (.parents | length) == 1 and
                  (.commit.message | test("^[^\\s:]+: (add|update) \\S+ bottle\\.$")) and
                  (.files | length) == 1 and .files[0].status == "modified" and
                  (.files[0].filename | test("^Formula/.+\\.rb$"))' > /dev/null <<< "$commit_data"; then
                reached_source_head=true
                break
              fi
              bottle_commits=$((bottle_commits + 1))
              candidate="$(jq -r '.parents[0].sha' <<< "$commit_data")"
            done

            if [[ "$reached_source_head" == true ]] && (( bottle_commits > 0 )); then
              source_tested="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$candidate&event=pull_request&status=success" | \
                jq -r --arg sha "$candidate" --arg repo "$GITHUB_REPOSITORY" --arg branch "$head_branch" '
                  [.workflow_runs[] | select(.head_sha == $sha and .head_repository.full_name == $repo and .head_branch == $branch)] |
                  length > 0')"
              if [[ "$source_tested" == true ]]; then
                echo "::warning::PR head $expected_head is $bottle_commits BrewTestBot bottle commit(s) on tested source head $candidate without a published-bottle status; reconciling."
                recovered_bottle_commit=true
              fi
            fi
          fi

          if [[ "$published_status" == true || -n "$legacy_marker_author" || "$recovered_bottle_commit" == true ]]; then
            echo "Published bottle commit already matches the current PR head; publication is a no-op."
            {
              echo "publish=false"
              echo "published_head=$expected_head"
              echo "legacy_marker_author=$legacy_marker_author"
              echo "recovered_bottle_commit=$recovered_bottle_commit"
            } >> "$GITHUB_OUTPUT"
          else
            # Homebrew uses the newest tests.yml check suite, regardless of its conclusion/event.
            # Never let an older PR success hide a newer failure, rerun, or non-PR artifact source.
            # gh pagination alone is insufficient if an API response silently omits a page or collection.
            delays=(5 10 20 30 60 60 60 60 60 60 60 60)
            for (( attempt = 0; attempt <= ${#delays[@]}; attempt++ )); do
              runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$expected_head&per_page=100")"
              run="$(jq -ce --arg sha "$expected_head" --arg repo "$GITHUB_REPOSITORY" --arg branch "$head_branch" '
                if length == 0 or
                   any(.[]; (.total_count | type) != "number" or (.workflow_runs | type) != "array")
                then error("Incomplete workflow run response") else . end |
                .[0].total_count as $total |
                if any(.[]; .total_count != $total) then error("Inconsistent workflow run count") else . end |
                [.[].workflow_runs[]] |
                if length != $total or (map(.id) | unique | length) != $total
                then error("Incomplete workflow run pagination") else . end |
                if all(.[]; (.id | type == "number" and . > 0 and . == floor) and
                  (.run_attempt | type == "number" and . > 0 and . == floor) and
                  (.created_at | fromdateiso8601) > 0 and (.status | type) == "string" and
                  (.head_sha | type) == "string" and (.head_branch | type) == "string" and
                  (.head_repository.full_name | type) == "string" and (.repository.full_name | type) == "string" and
                  (.event | type) == "string" and (.path | type) == "string")
                then . else error("Unverifiable workflow run metadata") end |
                sort_by(.created_at, .id) | last |
                select(.head_sha == $sha and .head_repository.full_name == $repo and
                  .repository.full_name == $repo and .head_branch == $branch and
                  .event == "pull_request" and .path == ".github/workflows/tests.yml") //
                error("Newest tests run does not match the source PR")
              ' <<< "$runs")"
              run_id="$(jq -er '.id | select(type == "number" and . > 0 and . == floor)' <<< "$run")"
              run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              jq -e --argjson id "$run_id" --arg sha "$expected_head" --arg repo "$GITHUB_REPOSITORY" --arg branch "$head_branch" '
                .id == $id and .head_sha == $sha and .head_repository.full_name == $repo and
                .repository.full_name == $repo and .head_branch == $branch and
                .event == "pull_request" and .path == ".github/workflows/tests.yml" and
                (.run_attempt | type == "number" and . > 0 and . == floor) and
                (.workflow_id | type == "number" and . > 0 and . == floor)
              ' > /dev/null <<< "$run"
              run_attempt="$(jq -r '.run_attempt' <<< "$run")"

              # label-pr adds pr-pull before its job/workflow can report terminal success. Wait only
              # for that reporting tail, never an unfinished matrix behind a stale admission label.
              if jq -e '.status == "completed" and .conclusion == "success"' > /dev/null <<< "$run"; then
                break
              fi
              jq -e '.status == "in_progress" and .conclusion == null' > /dev/null <<< "$run"
              jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100")"
              jq -e --argjson run "$run_id" --argjson attempt "$run_attempt" '
                length > 0 and
                all(.[]; (.total_count | type) == "number" and (.jobs | type) == "array") and
                (.[0].total_count as $total | all(.[]; .total_count == $total) and
                  ([.[].jobs[]] | length == $total and (map(.id) | unique | length) == $total)) and
                ([.[].jobs[]] |
                  all(.[]; .run_id == $run and
                    (.run_attempt | type == "number" and . > 0 and . == floor and . <= $attempt) and
                    (.id | type == "number" and . > 0 and . == floor) and (.name | type) == "string") and
                  (group_by(.name) | map(max_by([.run_attempt, .id])) |
                    all(.[]; (.status == "completed" and (.conclusion == "success" or .conclusion == "skipped")) or
                      ((.name == "label-pr" or .name == "formula-conclusion") and .run_attempt == $attempt and
                        (.status == "in_progress" or .status == "queued") and .conclusion == null)) and
                    any(.[]; .name == "label-pr" and .run_attempt == $attempt and
                      (.status == "in_progress" or .status == "queued" or (.status == "completed" and .conclusion == "success"))) and
                    any(.[]; (.name | startswith("build-formula (")) and .conclusion == "success")))
              ' > /dev/null <<< "$jobs"
              if (( attempt == ${#delays[@]} )); then
                echo "::error::Timed out waiting for label-pr to finish on the source head."
                exit 1
              fi
              sleep "${delays[attempt]}"
              pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
              if jq -e 'any(.labels[]; .name == "in progress")' > /dev/null <<< "$pr_data"; then
                echo "PR was held while waiting for source CI; skipping."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "held=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              jq -e --arg sha "$expected_head" --arg repo "$GITHUB_REPOSITORY" --arg branch "$head_branch" '
                .state == "open" and .draft == false and .base.ref == "main" and
                .head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $branch and
                any(.labels[]; .name == "pr-pull")
              ' > /dev/null <<< "$pr_data"
            done

            artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            # Artifacts are run-scoped, not attempt-scoped. Homebrew selects the newest artifact of
            # each name, including retained successful platforms from a failed-jobs-only rerun.
            artifacts="$(jq -ce --argjson run "$run_id" --arg sha "$expected_head" --arg branch "$head_branch" '
              if length == 0 or
                 any(.[]; (.total_count | type) != "number" or (.artifacts | type) != "array")
              then error("Incomplete artifact response") else . end |
              .[0].total_count as $total |
              if any(.[]; .total_count != $total) then error("Inconsistent artifact count") else . end |
              [.[].artifacts[]] |
              if length != $total or (map(.id) | unique | length) != $total
              then error("Incomplete artifact pagination") else . end |
              if all(.[]; (.id | type) == "number" and (.name | type) == "string" and
                (.created_at | fromdateiso8601) > 0 and (.expired | type) == "boolean" and
                (.size_in_bytes | type) == "number" and .size_in_bytes > 0 and
                .workflow_run.id == $run and .workflow_run.head_sha == $sha and .workflow_run.head_branch == $branch)
              then . else error("Unverifiable artifact metadata") end |
              group_by(.name) | map(
                sort_by(.created_at) | .[-1].created_at as $newest |
                map(select(.created_at == $newest)) |
                if length == 1 then .[0] else error("Ambiguous newest artifact") end) |
              if any(.[]; (.name == "bottles" or (.name | startswith("bottles_")))) and
                all(.[] | select(.name == "bottles" or (.name | startswith("bottles_")));
                  .expired == false and (.expires_at | fromdateiso8601) > now)
              then . else error("Missing or expired bottle artifacts") end
            ' <<< "$artifacts")"

            # A later clean rebuild of the SAME platform supersedes its old failure artifact.
            # Comparing artifact times alone is unsafe: post-build uploads failures before bottles
            # in the same attempt. Require an actual attempt boundary between the two uploads.
            attempt_starts='[]'
            if jq -e 'any(.[]; .name | startswith("failed-bottles"))' > /dev/null <<< "$artifacts"; then
              for (( previous_attempt = 2; previous_attempt <= run_attempt; previous_attempt++ )); do
                attempt_data="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$previous_attempt")"
                started="$(jq -er --argjson run "$run_id" --argjson attempt "$previous_attempt" --arg sha "$expected_head" '
                  select(.id == $run and .run_attempt == $attempt and .head_sha == $sha) |
                  .run_started_at | fromdateiso8601
                ' <<< "$attempt_data")"
                attempt_starts="$(jq -c --argjson started "$started" '. + [$started]' <<< "$attempt_starts")"
              done
            fi
            jq -e --argjson starts "$attempt_starts" '
              . as $artifacts |
              all(.[] | select(.name | startswith("failed-bottles")); . as $failure |
                ($artifacts | map(select(.name == ($failure.name | sub("^failed-"; "")))) | first) as $bottle |
                $bottle != null and any($starts[];
                  . > ($failure.created_at | fromdateiso8601) and . <= ($bottle.created_at | fromdateiso8601)))
            ' > /dev/null <<< "$artifacts"
            {
              echo "qualified_run_id=$run_id"
              echo "qualified_run_attempt=$run_attempt"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile published bottle label
        if: steps.pr-details.outputs.publish == 'false' && steps.pr-details.outputs.no_bottles != 'true' && steps.pr-details.outputs.merged != 'true' && steps.pr-details.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          BOT_TOKEN: ${{ github.token }}
          VERIFIED_PUBLISHED_HEAD: ${{ steps.pr-details.outputs.published_head }}
          LEGACY_MARKER_AUTHOR: ${{ steps.pr-details.outputs.legacy_marker_author }}
          HEAD_BRANCH: ${{ steps.pr-details.outputs.head_branch }}
          RECOVERED_BOTTLE_COMMIT: ${{ steps.pr-details.outputs.recovered_bottle_commit }}
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          if jq -e 'any(.labels[]; .name == "in progress")' > /dev/null <<< "$pr_data"; then
            echo "PR is intentionally held; skipping reconciliation."
            exit 0
          fi
          current_head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
          current_head_branch="$(jq -r '.head.ref // empty' <<< "$pr_data")"
          current_head_sha="$(jq -r '.head.sha // empty' <<< "$pr_data")"
          state="$(jq -r '.state' <<< "$pr_data")"
          draft="$(jq -r '.draft' <<< "$pr_data")"
          base_branch="$(jq -r '.base.ref' <<< "$pr_data")"
          remote_git_head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$HEAD_BRANCH" | cut -f1)"
          if [[ "$state" != "open" || "$draft" != "false" || "$base_branch" != "main" ||
                "$current_head_repo" != "$GITHUB_REPOSITORY" ||
                "$current_head_branch" != "$HEAD_BRANCH" ||
                -z "$VERIFIED_PUBLISHED_HEAD" || "$current_head_sha" != "$VERIFIED_PUBLISHED_HEAD" ||
                "$remote_git_head" != "$VERIFIED_PUBLISHED_HEAD" ]]; then
            echo "::error::Refusing to mark bottles published because the current PR head no longer matches the verified published head."
            exit 1
          fi

          if [[ -n "$LEGACY_MARKER_AUTHOR" ]]; then
            if [[ "$LEGACY_MARKER_AUTHOR" != "github-actions[bot]" && "$LEGACY_MARKER_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
              echo "::error::Refusing an unrecognized published-bottle marker author: $LEGACY_MARKER_AUTHOR"
              exit 1
            fi
            echo "Migrating the verified legacy comment marker from $LEGACY_MARKER_AUTHOR to a commit status."
            GH_TOKEN="$BOT_TOKEN" gh api --method POST --silent "repos/$GITHUB_REPOSITORY/statuses/$VERIFIED_PUBLISHED_HEAD" \
              -f state=success -f context="$PUBLISHED_HEAD_CONTEXT" -f description="Bottle commit published"
          elif [[ "$RECOVERED_BOTTLE_COMMIT" == true ]]; then
            echo "Recording the published-bottle status for bottle commits pushed by a previous attempt."
            GH_TOKEN="$BOT_TOKEN" gh api --method POST --silent "repos/$GITHUB_REPOSITORY/statuses/$VERIFIED_PUBLISHED_HEAD" \
              -f state=success -f context="$PUBLISHED_HEAD_CONTEXT" -f description="Bottle commit published"
          fi

          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label CI-published-bottle-commits

      - name: Set up Homebrew
        if: steps.pr-details.outputs.publish == 'true'
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          core: true
          cask: false

      - name: Trust this tap
        if: steps.pr-details.outputs.publish == 'true'
        run: brew trust --tap "$GITHUB_REPOSITORY"

      - name: Set up git
        if: steps.pr-details.outputs.publish == 'true'
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          username: BrewTestBot

      - name: Checkout PR branch
        if: steps.pr-details.outputs.publish == 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          EXPECTED_HEAD: ${{ steps.pr-details.outputs.expected_head }}
          HEAD_BRANCH: ${{ steps.pr-details.outputs.head_branch }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR" --repo "$GITHUB_REPOSITORY"

          local_git_head="$(git rev-parse HEAD)"
          remote_git_head="$(git ls-remote origin "pull/$PR/head" | cut -f1)"
          local_branch="$(git branch --show-current)"

          if [[ "$local_git_head" != "$EXPECTED_HEAD" ||
                "$remote_git_head" != "$EXPECTED_HEAD" ||
                "$local_branch" != "$HEAD_BRANCH" ]]; then
            echo "::error::Unexpected change in target branch."
            echo "::error::Expected SHA1    $EXPECTED_HEAD"
            echo "::error::Checked out SHA1 $local_git_head"
            echo "::error::PR branch SHA1   $remote_git_head"
            echo "::error::Checked out branch $local_branch"
            exit 1
          fi

      - name: Pull bottles
        id: pr-pull
        if: steps.pr-details.outputs.publish == 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          EXPECTED_HEAD: ${{ steps.pr-details.outputs.expected_head }}
        run: |
          brew pr-pull \
            --no-upload \
            --debug \
            --clean \
            --no-cherry-pick \
            --workflows=tests.yml \
            --head-sha="$EXPECTED_HEAD" \
            --root-url="https://ghcr.io/v2/chenrui333/tap" \
            --tap="$GITHUB_REPOSITORY" \
            --retain-bottle-dir \
            "$PR"

      - name: Upload bottles
        id: pr-upload
        if: steps.pr-details.outputs.publish == 'true'
        working-directory: ${{ steps.pr-pull.outputs.bottle_path }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          REPO_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
          EXPECTED_HEAD: ${{ steps.pr-details.outputs.expected_head }}
          HEAD_BRANCH: ${{ steps.pr-details.outputs.head_branch }}
          QUALIFIED_RUN_ID: ${{ steps.pr-details.outputs.qualified_run_id }}
          QUALIFIED_RUN_ATTEMPT: ${{ steps.pr-details.outputs.qualified_run_attempt }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          # Manual re-dispatches repair a publish whose upload succeeded but whose bottle commit was
          # never pushed; the same CI artifacts are re-uploaded, so an existing tag is not an error.
          REPAIR_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '--warn-on-upload-failure' || '' }}
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          if jq -e 'any(.labels[]; .name == "in progress")' > /dev/null <<< "$pr_data"; then
            echo "PR was held before upload; skipping."
            echo "held=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e --arg sha "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" --arg branch "$HEAD_BRANCH" '
            .state == "open" and .draft == false and .base.ref == "main" and
            .head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $branch and
            any(.labels[]; .name == "pr-pull")
          ' > /dev/null <<< "$pr_data"
          remote_git_head="$(git -C "$REPO_PATH" ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          [[ "$remote_git_head" == "$EXPECTED_HEAD" ]]
          # The source may have been rerun while pr-pull downloaded/prepared its artifacts. Do not
          # upload against a different newest run/attempt, even if the earlier admission was green.
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$EXPECTED_HEAD&per_page=100")"
          jq -e --argjson id "$QUALIFIED_RUN_ID" --argjson attempt "$QUALIFIED_RUN_ATTEMPT" \
            --arg sha "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" --arg branch "$HEAD_BRANCH" '
            length > 0 and all(.[]; (.total_count | type) == "number" and (.workflow_runs | type) == "array") and
            (.[0].total_count as $total | all(.[]; .total_count == $total) and
              ([.[].workflow_runs[]] | length == $total and (map(.id) | unique | length) == $total)) and
            ([.[].workflow_runs[]] |
              all(.[]; (.id | type == "number" and . > 0 and . == floor) and
                (.created_at | fromdateiso8601) > 0) and
              (sort_by(.created_at, .id) | last |
                .head_sha == $sha and .head_repository.full_name == $repo and
                .repository.full_name == $repo and .head_branch == $branch and
                .event == "pull_request" and .path == ".github/workflows/tests.yml" and
                .id == $id and .run_attempt == $attempt and .status == "completed" and .conclusion == "success"))
          ' > /dev/null <<< "$runs"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID")"
          jq -e --argjson id "$QUALIFIED_RUN_ID" --argjson attempt "$QUALIFIED_RUN_ATTEMPT" \
            --arg sha "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" --arg branch "$HEAD_BRANCH" '
            .id == $id and .run_attempt == $attempt and .head_sha == $sha and
            .head_repository.full_name == $repo and .repository.full_name == $repo and
            .head_branch == $branch and .event == "pull_request" and .path == ".github/workflows/tests.yml" and
            .status == "completed" and .conclusion == "success" and
            (.workflow_id | type == "number" and . > 0 and . == floor)
          ' > /dev/null <<< "$run"
          workflow_id="$(jq -r '.workflow_id' <<< "$run")"
          # pr-pull currently selects the last matching suite among checkSuites(first: 100), not a
          # caller-supplied run ID. Verify its actual selector agrees, and refuse truncated suites.
          consumer="$(gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query="$(cat <<'GRAPHQL'
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  commits(last: 1) { nodes { commit {
                    oid
                    checkSuites(first: 100) {
                      totalCount
                      pageInfo { hasNextPage }
                      nodes { status workflowRun { databaseId workflow { databaseId } } }
                    }
                  } } }
                }
              }
            }
          GRAPHQL
          )")"
          jq -e --arg sha "$EXPECTED_HEAD" --argjson id "$QUALIFIED_RUN_ID" --argjson workflow "$workflow_id" '
            ((.errors // []) | length) == 0 and
            (.data.repository.pullRequest.commits.nodes |
              length == 1 and
              (.[0].commit | .oid == $sha and
                (.checkSuites | .pageInfo.hasNextPage == false and
                  (.nodes | type) == "array" and .totalCount == (.nodes | length) and
                  ([.nodes[] | select(.workflowRun.workflow.databaseId == $workflow)] | last |
                    .status == "COMPLETED" and .workflowRun.databaseId == $id))))
          ' > /dev/null <<< "$consumer"
          git -C "$REPO_PATH" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # shellcheck disable=SC2086 # REPAIR_UPLOAD is empty or a single flag
          brew pr-upload \
            --debug \
            $REPAIR_UPLOAD \
            --root-url="https://ghcr.io/v2/chenrui333/tap"

          published_head_sha="$(git -C "$REPO_PATH" rev-parse HEAD)"
          if [[ "$published_head_sha" == "$EXPECTED_HEAD" ]]; then
            echo "::error::Bottle publication did not create a commit on the PR branch."
            exit 1
          fi
          echo "published_head_sha=$published_head_sha" >> "$GITHUB_OUTPUT"

      - name: Verify PR branch unchanged before push
        id: push-admission
        if: steps.pr-details.outputs.publish == 'true' && steps.pr-upload.outputs.held != 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          EXPECTED_HEAD: ${{ steps.pr-details.outputs.expected_head }}
          HEAD_BRANCH: ${{ steps.pr-details.outputs.head_branch }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          if jq -e 'any(.labels[]; .name == "in progress")' > /dev/null <<< "$pr_data"; then
            echo "PR was held before push; skipping."
            echo "held=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '.state == "open" and .draft == false and .base.ref == "main" and
            any(.labels[]; .name == "pr-pull")' > /dev/null <<< "$pr_data"
          current_head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
          current_head_branch="$(jq -r '.head.ref // empty' <<< "$pr_data")"
          current_head_sha="$(jq -r '.head.sha // empty' <<< "$pr_data")"
          remote_git_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          if [[ "$current_head_repo" != "$GITHUB_REPOSITORY" ||
                "$current_head_branch" != "$HEAD_BRANCH" ||
                "$current_head_sha" != "$EXPECTED_HEAD" ||
                "$remote_git_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR branch changed while bottles were being prepared."
            echo "::error::Expected SHA1 $EXPECTED_HEAD"
            echo "::error::Current PR branch $current_head_repo:$current_head_branch at $current_head_sha"
            echo "::error::PR branch SHA1 $remote_git_head"
            exit 1
          fi

      - name: Push commits
        if: steps.pr-details.outputs.publish == 'true' && steps.pr-upload.outputs.held != 'true' && steps.push-admission.outputs.held != 'true'
        uses: Homebrew/actions/git-try-push@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          remote: origin
          branch: ${{ steps.pr-details.outputs.head_branch }}
          remote_branch: ${{ steps.pr-details.outputs.head_branch }}
          tries: 1

      - name: Verify pushed bottle commit
        if: steps.pr-details.outputs.publish == 'true' && steps.pr-upload.outputs.held != 'true' && steps.push-admission.outputs.held != 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          PUBLISHED_HEAD: ${{ steps.pr-upload.outputs.published_head_sha }}
          EXPECTED_HEAD: ${{ steps.pr-details.outputs.expected_head }}
          HEAD_BRANCH: ${{ steps.pr-details.outputs.head_branch }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          pr_head_verified=false
          pr_head_observed=false
          current_head_repo=""
          current_head_branch=""
          current_head_sha=""
          # The pulls API can lag the branch ref by minutes after a push; back off for about ten minutes.
          delays=(5 10 20 30 60 60 60 60 60 60 60 60)
          attempts=$(( ${#delays[@]} + 1 ))

          for (( attempt = 1; attempt <= attempts; attempt++ )); do
            remote_git_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
            if [[ "$remote_git_head" != "$PUBLISHED_HEAD" ]]; then
              echo "::error::PR branch head does not match the published bottle commit."
              echo "::error::Expected SHA1 $PUBLISHED_HEAD"
              echo "::error::PR branch SHA1 $remote_git_head"
              exit 1
            fi

            if pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"; then
              current_head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_data")"
              current_head_branch="$(jq -r '.head.ref // empty' <<< "$pr_data")"
              current_head_sha="$(jq -r '.head.sha // empty' <<< "$pr_data")"
              state="$(jq -r '.state' <<< "$pr_data")"
              draft="$(jq -r '.draft' <<< "$pr_data")"
              base_branch="$(jq -r '.base.ref' <<< "$pr_data")"

              if [[ "$state" != "open" || "$draft" != "false" || "$base_branch" != "main" ||
                    "$current_head_repo" != "$GITHUB_REPOSITORY" ||
                    "$current_head_branch" != "$HEAD_BRANCH" ]]; then
                echo "::error::PR changed during bottle publication."
                echo "::error::Expected open, non-draft PR $GITHUB_REPOSITORY:$HEAD_BRANCH targeting main"
                echo "::error::Current PR $current_head_repo:$current_head_branch state=$state draft=$draft base=$base_branch"
                exit 1
              fi

              if [[ "$current_head_sha" == "$PUBLISHED_HEAD" ]]; then
                pr_head_verified=true
                break
              fi

              # A lagging API may only report the pre-push head; anything else means the branch moved.
              if [[ "$current_head_sha" != "$EXPECTED_HEAD" ]]; then
                echo "::error::GitHub PR head moved to an unexpected commit during bottle publication."
                echo "::error::Expected PR head $PUBLISHED_HEAD (or lagging $EXPECTED_HEAD)"
                echo "::error::Current PR head $current_head_sha"
                exit 1
              fi
              pr_head_observed=true
            fi

            if (( attempt < attempts )); then
              delay="${delays[attempt - 1]}"
              echo "::warning::GitHub PR head has not caught up to the published bottle commit (attempt $attempt/$attempts); retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          if [[ "$pr_head_verified" != true ]]; then
            if [[ "$pr_head_observed" != true ]]; then
              echo "::error::GitHub PR API never returned the PR head during bottle publication."
              echo "::error::Expected PR head $GITHUB_REPOSITORY:$HEAD_BRANCH at $PUBLISHED_HEAD"
              exit 1
            fi
            echo "::warning::GitHub PR API still reports $current_head_sha, but refs/heads/$HEAD_BRANCH is exactly the published bottle commit $PUBLISHED_HEAD; treating it as published."
          fi

      - name: Mark PR with published bottle commits
        if: steps.pr-details.outputs.publish == 'true' && steps.pr-upload.outputs.held != 'true' && steps.push-admission.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: gh pr edit --add-label CI-published-bottle-commits "$PR" --repo "$GITHUB_REPOSITORY"

      - name: Record published bottle head
        if: steps.pr-details.outputs.publish == 'true' && steps.pr-upload.outputs.held != 'true' && steps.push-admission.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_HEAD: ${{ steps.pr-upload.outputs.published_head_sha }}
        run: >-
          gh api --method POST --silent "repos/$GITHUB_REPOSITORY/statuses/$PUBLISHED_HEAD"
          -f state=success -f context="$PUBLISHED_HEAD_CONTEXT" -f description="Bottle commit published"
