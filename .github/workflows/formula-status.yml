name: Formula Metadata

on:
  # Run every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
    # Backup monthly run (1st day of month at 09:00 UTC)
    - cron: '0 9 1 * *'
  # Allow manual triggering
  workflow_dispatch:

concurrency:
  group: formula-status
  cancel-in-progress: true

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  generate-metadata:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare automation branch
        id: prepare
        env:
          BRANCH: automation/formula-metadata
        run: .github/scripts/publish-generated-pr.sh prepare

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Verify dependencies
        run: |
          which python3
          which gh
          python3 --version
          gh --version

      - name: Generate formula metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 formula-status/generate_formula_status.py --output formula-status/formula-status.md

      - name: Publish generated PR
        id: publish
        env:
          BRANCH: automation/formula-metadata
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: 'chore: update formula metadata'
          PR_BODY: Generated automatically by the Formula Metadata workflow.
          COMMIT_MESSAGE: 'chore: update formula metadata'
        run: .github/scripts/publish-generated-pr.sh publish formula-status/formula-status.md .cache/

      - name: Summary
        run: |
          if [ -f formula-status/formula-status.md ]; then
            {
              echo "## Formula Metadata Report"
              echo ""
              echo "✅ Metadata report generated successfully"
              echo ""

              TOTAL=$(grep -c '^| [a-z]' formula-status/formula-status.md 2>/dev/null || echo 0)
              echo "**Total formulas**: $TOTAL"

              if [ "${{ steps.publish.outputs.action }}" = "created-pr" ]; then
                echo ""
                echo "📝 Generated PR created"
              elif [ "${{ steps.publish.outputs.action }}" = "updated-pr" ]; then
                echo ""
                echo "📝 Generated PR updated"
              elif [ "${{ steps.publish.outputs.action }}" = "closed-stale-pr" ]; then
                echo ""
                echo "🧹 Stale generated PR closed because output is current"
              else
                echo ""
                echo "ℹ️ No changes detected"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Failed to generate metadata report" >> "$GITHUB_STEP_SUMMARY"
          fi
